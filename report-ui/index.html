<title>Visual regression report</title>
<script>
  // Stamp the theme before first paint so dark-mode viewers never see a light flash.
  (function () {
    try {
      var saved = localStorage.getItem('vrt-theme');
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
</script>
</head>

<div id="root"></div>
<script type="application/json" id="vrt-data">__VRT_DATA__</script>
