# Dogfood of approve mode: "/vrt approve ..." comments on our own PRs rerun
# the failed Visual demo check, which then honors the approvals.
name: VRT approvals

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  approve:
    if: ${{ github.event.issue.pull_request && (startsWith(github.event.comment.body, '/vrt approve') || contains(github.event.comment.body, 'vrt:approve-all')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          mode: approve
